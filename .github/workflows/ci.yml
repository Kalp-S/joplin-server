name: CI / Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Sync Service Config & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Docker Compose Config
        run: |
          cp .env.example .env
          docker compose config

      - name: Syntax and Test Suite Verification
        run: python3 -m py_compile tests/test_sync_service.py

  ci-success:
    name: CI Test Suite Pass
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Gate Check
        run: echo "Joplin configuration and test validation passed."
